name: Deploy to ECS
on:
  push:
    branches: [main]

permissions:
  id-token: write #Required for OIDC authentication
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v3
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username

      - name: Build, Tag and Push DOCKER image to ECR
        env:
          ECR_REGISTERY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: flask.app
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTERY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTERY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTERY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Fill in the new image ID in the ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ecs-task-def.json
          container-name: flaskapp-affectionate_shaw
          image: ${{ steps.build-and-push-image.outputs.image }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: myService
          cluster: myCluster
          force-new-deployment: true